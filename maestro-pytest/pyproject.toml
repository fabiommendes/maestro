[project]
name = "maestro-pytest"
description = "Pytest plugin for automatic grading tasks"
authors = [
    { name = "Fábio Macêdo Mendes ", email = "fabiomacedomendes@gmail.com" },
]
classifiers = ["Framework :: Pytest"]
version = "0.1.0"
dependencies = [
    "pydantic>=2.12.0",
    "pytest>=8.4.2",
    "python-slugify>=8.0.4",
    "rich>=14.2.0",
    "toml>=0.10.2",
    "typer>=0.19.2",
]
requires-python = ">=3.11"

[project.entry-points.pytest11]
maestro-pytest = "maestro_pytest.plugin"

[project.scripts]
maestro-test = "maestro_pytest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.maestro-test.config]
id = "maestro-pytest"

[tool.maestro-test.grades]
total = 100.0
passed = 1.0
failed = 0.0
error = 0.0
